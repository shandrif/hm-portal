<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B1A10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HM Portal</title>
<style>
/* Layout: iPhone home screen — wallpaper, status widget, app icon grid, Spotlight pill + dock pinned at the bottom.
   Alerts and sheets follow iOS system style; edit mode wiggles icons like rearranging apps. */
:root{
  --font:"Frutiger LT Arabic","Frutiger",-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --tint:#2F7564; --red:#FF3B30; --green:#34C759; --tan:#D4B38B; --teal:#84C6B2; --cream:#F5EDE3; --ink:#111111;
  --label:#000; --label2:rgba(60,60,67,.6); --sep:rgba(60,60,67,.29);
  --sheet:rgba(242,242,247,.92); --group:#fff; --alert:rgba(242,242,247,.82); --menu:rgba(250,250,252,.78); --fill:rgba(118,118,128,.12);
  --spring:cubic-bezier(.32,1.28,.46,1); --ease-out:cubic-bezier(.23,1,.32,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --tint:#84C6B2; --red:#FF453A; --green:#30D158;
  --label:#fff; --label2:rgba(235,235,245,.6); --sep:rgba(84,84,88,.6);
  --sheet:rgba(28,28,30,.94); --group:#2C2C2E; --alert:rgba(44,44,46,.82); --menu:rgba(44,44,46,.8); --fill:rgba(118,118,128,.24);
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:15px;line-height:1.35;color:#fff;background:#2B1A10;-webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow-x:hidden}
input{-webkit-user-select:text;user-select:text}
/* live background: the HM bear, drawn frame-by-frame on a canvas; turns to follow the cursor */
.stage{position:fixed;inset:0;z-index:-2;overflow:hidden;background:#2B1A10;pointer-events:none}
.stage::before{content:"";position:absolute;inset:-60px;background:#2B1A10 url("frames/poster-960.jpg") center/cover no-repeat;
  filter:blur(36px) brightness(.85) saturate(1.1)}
.stage canvas{position:absolute;display:block;opacity:0;transition:opacity 600ms var(--ease-out)}
.stage canvas.ready{opacity:1}
.stage canvas.fade{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 14%,#000 86%,transparent 100%)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,0) 65%,rgba(0,0,0,.28) 100%)}

/* Liquid Glass material */
.lg{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
  -webkit-backdrop-filter:blur(22px) saturate(190%);backdrop-filter:blur(22px) saturate(190%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.55),inset 0 -1px 1px rgba(255,255,255,.12),inset 0 0 0 .5px rgba(255,255,255,.35),0 8px 30px rgba(0,0,0,.18)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.lg{background:rgba(70,20,26,.72)}}

/* screen */
.home{max-width:820px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:22px;
  padding:max(14px,env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(170px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.pill{font:inherit;font-size:15px;font-weight:600;color:#fff;border:0;border-radius:999px;padding:8px 16px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  transition:transform 180ms var(--ease-out)}
.pill:active{transform:scale(.94)}
.pill.round{width:36px;height:36px;padding:0;justify-content:center}
.pill svg{width:18px;height:18px}
.topbar .left{display:flex;gap:8px}

/* widget */
.widget{border-radius:24px;padding:16px 18px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;
  animation:in 520ms var(--ease-out) both}
.wlogo{width:52px;height:52px;border-radius:14px;background:var(--ink);color:var(--cream);display:grid;place-items:center;font-weight:700;font-size:19px;letter-spacing:-.5px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.wmain{min-width:0}
.wmain .t{font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;opacity:.75}
.wmain .h{font-size:20px;font-weight:700;letter-spacing:-.02em;margin-top:1px}
.wmain .s{font-size:13px;opacity:.8;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wstat{display:flex;gap:16px;text-align:center}
.wstat b{display:block;font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.wstat span{font-size:11px;font-weight:600;opacity:.75}
.wstat .on b{color:#7CF0A6}.wstat .off b{color:#FF8F86}
@media (max-width:380px){.wlogo{display:none}.widget{grid-template-columns:1fr auto}}

/* icon grid */
.sectiontitle{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:0 2px -8px;text-shadow:0 1px 8px rgba(0,0,0,.35)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:24px;column-gap:10px}
@media (min-width:600px){.grid{grid-template-columns:repeat(6,1fr)}}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;color:#fff;text-decoration:none;position:relative;min-width:0;outline:none;
  animation:in 480ms var(--ease-out) both;animation-delay:calc(var(--i,0)*35ms + 80ms)}
body.ready .app,body.ready .widget{animation:none}
.icon{position:relative;width:64px;height:64px;border-radius:22.5%;display:grid;place-items:center;font-size:32px;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -2px 4px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.22);
  transition:transform 220ms var(--ease-out),filter 220ms}
.icon.img{background:transparent!important}
.icon.img img{width:100%;height:100%;display:block;border-radius:inherit;object-fit:cover;pointer-events:none}
.icon::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 50%);pointer-events:none}
@media (min-width:600px){.icon{width:72px;height:72px;font-size:36px}}
.app:active .icon{transform:scale(.9);filter:brightness(.85)}
.app:focus-visible .icon{outline:3px solid rgba(255,255,255,.9);outline-offset:3px}
.name{font-size:12px;font-weight:500;max-width:100%;padding:0 2px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.badge{position:absolute;top:-4px;right:-4px;width:15px;height:15px;border-radius:50%;border:2.5px solid rgba(255,255,255,.95);background:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.3);z-index:1}
.badge.down{background:#FF3B30}.badge.wait{background:#B7ADA1}
.del{display:none;position:absolute;top:-7px;left:calc(50% - 39px);width:22px;height:22px;border-radius:50%;border:0;padding:0;cursor:pointer;
  background:rgba(120,120,128,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:700 18px/22px var(--font);z-index:2}
@media (min-width:600px){.del{left:calc(50% - 43px)}}
body.edit .del{display:block}
body.edit .badge{display:none}
body.edit .app .icon{animation:jiggle .26s ease-in-out infinite alternate;animation-delay:calc(var(--i,0)*-70ms)}
@keyframes jiggle{from{transform:rotate(-1.6deg)}to{transform:rotate(1.6deg)}}
@keyframes in{from{opacity:.001;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.empty{text-align:center;opacity:.9;font-size:15px;padding:30px 0;text-shadow:0 1px 6px rgba(0,0,0,.4)}

/* bottom: Spotlight pill + dock */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;
  padding:0 max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.bottom>*{pointer-events:auto}
.spot{display:flex;align-items:center;gap:6px;border-radius:999px;padding:0 14px;height:34px;width:min(140px,60vw);cursor:text;
  transition:width 320ms var(--spring)}
.spot:focus-within{width:min(420px,calc(100vw - 24px))}
.spot svg{width:15px;height:15px;flex:none;opacity:.9}
.spot input{flex:1;min-width:0;border:0;background:transparent;color:#fff;font:inherit;font-size:16px;font-weight:600;outline:none;-webkit-appearance:none;appearance:none}
.spot input::placeholder{color:rgba(255,255,255,.92)}
.spot input::-webkit-search-cancel-button{-webkit-appearance:none}
.dock{border-radius:34px;padding:14px 18px;display:flex;gap:22px;justify-content:center;min-height:94px;align-items:center;max-width:calc(100vw - 24px)}
.dock .app .name{display:none}
.dock .hint{font-size:13px;opacity:.85;padding:0 10px;text-align:center}

/* touch & hold menu */
.menuwrap{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;
  background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);animation:fade 220ms var(--ease-out) both}
.menuwrap>.icon{width:84px;height:84px;font-size:42px;animation:pop 340ms var(--spring) both}
.menu{width:min(270px,100%);border-radius:14px;overflow:hidden;background:var(--menu);color:var(--label);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);box-shadow:0 20px 60px rgba(0,0,0,.35);
  transform-origin:top center;animation:pop 340ms var(--spring) both}
.menu .head{padding:12px 16px;border-bottom:.5px solid var(--sep)}
.menu .head b{display:block;font-size:15px}
.menu .head span{display:block;font-size:13px;color:var(--label2);margin-top:2px;overflow-wrap:anywhere}
.menu button,.menu a{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;width:100%;padding:12px 16px;font-size:17px;cursor:pointer;
  border-bottom:.5px solid var(--sep);color:var(--label);font-family:var(--font)}
.menu>*:last-child{border-bottom:0}
.menu button:active,.menu a:active{background:var(--fill)}
.menu svg{width:20px;height:20px}
.menu .muted{color:var(--label2);padding:12px 16px;font-size:15px;border-bottom:.5px solid var(--sep)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}

/* iOS alert */
.scrim{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,.4);animation:fade 200ms var(--ease-out) both}
.alert{width:270px;border-radius:14px;overflow:hidden;background:var(--alert);color:var(--label);text-align:center;
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);animation:alertin 320ms var(--spring) both}
@keyframes alertin{from{opacity:0;transform:scale(1.12)}to{opacity:1;transform:none}}
.alert .body{padding:19px 16px 16px;display:flex;flex-direction:column;gap:8px}
.alert h3{margin:0;font-size:17px;font-weight:600}
.alert p{margin:0;font-size:13px;line-height:1.35}
.alert input{font:inherit;font-size:16px;text-align:left;width:100%;padding:7px 8px;border-radius:7px;border:.5px solid var(--sep);background:var(--group);color:var(--label)}
.alert .err{color:var(--red)}
.alert .err:empty{display:none}
.alert .acts{display:flex;border-top:.5px solid var(--sep)}
.alert .acts button{flex:1;font:inherit;font-size:17px;border:0;background:transparent;color:var(--tint);padding:11px 8px;cursor:pointer}
.alert .acts button+button{border-left:.5px solid var(--sep);font-weight:600}
.alert .acts button:active{background:var(--fill)}
.alert .acts .destructive{color:var(--red)}

/* iOS sheet */
.sheetwrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.4);animation:fade 220ms var(--ease-out) both}
@media (min-width:700px){.sheetwrap{align-items:center}}
.sheet{width:100%;max-width:540px;max-height:92vh;overflow:auto;background:var(--sheet);color:var(--label);border-radius:14px 14px 0 0;
  padding-bottom:max(20px,env(safe-area-inset-bottom,0px));animation:sheetin 420ms var(--ease-out) both}
@media (min-width:700px){.sheet{border-radius:14px;animation-name:alertin}}
@keyframes sheetin{from{transform:translateY(100%)}to{transform:none}}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--sep);margin:6px auto 0}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 16px 4px}
.nav h3{margin:0;font-size:17px;font-weight:600}
.nav button{font:inherit;font-size:17px;border:0;background:transparent;color:var(--tint);cursor:pointer;padding:6px 0}
.nav button:last-child{justify-self:end;font-weight:600}
.nav button:first-child{justify-self:start}
.preview{display:flex;justify-content:center;padding:12px 0 6px}
.preview .icon{width:72px;height:72px;font-size:36px;cursor:pointer}
.iconbtns{flex:1;display:flex;justify-content:flex-end;gap:18px}
.tbtn{font:inherit;font-size:17px;border:0;background:transparent;color:var(--tint);cursor:pointer;padding:11px 0}
.tbtn.destructive{color:var(--red)}
.hfile{flex:1;min-width:0;font-size:15px;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:center}
.tbtn:disabled{opacity:.5;cursor:default}
.grp{margin:14px 16px 0;border-radius:10px;background:var(--group);overflow:hidden}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:44px;border-bottom:.5px solid var(--sep)}
.field:last-child{border-bottom:0}
.field span{width:80px;flex:none;font-size:17px}
.field input{flex:1;min-width:0;font:inherit;font-size:17px;border:0;background:transparent;color:var(--label);padding:11px 0;outline:none}
.field input::placeholder{color:var(--label2)}
.foot{margin:8px 32px 0;font-size:13px;color:var(--label2)}
.sheet .err{color:var(--red);margin:10px 32px 0;font-size:13px}
.sheet .err:empty{display:none}
.swatches{display:flex;gap:12px;padding:10px 16px 12px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--group),0 0 0 4px var(--tint)}

.toast{position:fixed;left:50%;top:max(14px,env(safe-area-inset-top,0px));z-index:50;translate:-50% 0;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;
  max-width:calc(100vw - 32px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:pop 300ms var(--spring) both}


@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage" aria-hidden="true"><canvas id="stageCanvas"></canvas></div>
<main class="home">
  <div class="topbar">
    <div class="left">
      <button class="pill lg round" id="addBtn" type="button" hidden aria-label="Add app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <button class="pill lg round" id="adminBtn" type="button" aria-label="Admin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
    <button class="pill lg" id="doneBtn" type="button" hidden>Done</button>
  </div>

  <section class="widget lg" id="widget" aria-live="polite">
    <div class="wlogo" aria-hidden="true">½M</div>
    <div class="wmain">
      <div class="t" id="wDate">Today</div>
      <div class="h">HM Portal</div>
      <div class="s" id="wSub">Checking your apps…</div>
    </div>
    <div class="wstat">
      <div class="on"><b id="wOn">–</b><span>Online</span></div>
      <div class="off"><b id="wOff">–</b><span>Offline</span></div>
    </div>
  </section>

  <h2 class="sectiontitle" id="resultsTitle" hidden>Results</h2>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="bottom">
  <label class="spot lg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg>
    <input id="search" type="search" placeholder="Search" aria-label="Search apps" autocomplete="off"></label>
  <nav class="dock lg" id="dock" aria-label="Dock"></nav>
</div>

<div class="menuwrap" id="menuWrap" hidden></div>

<div class="scrim" id="loginBox" hidden>
  <form class="alert" id="loginForm">
    <div class="body">
      <h3>Admin Sign In</h3>
      <p>Sign in to add, edit or delete apps.</p>
      <input id="lUser" placeholder="ID" autocomplete="username" autocapitalize="off" required>
      <input id="lPass" type="password" placeholder="Password" autocomplete="current-password" required>
      <p class="err" id="lErr"></p>
    </div>
    <div class="acts"><button type="button" data-close>Cancel</button><button type="submit">Sign In</button></div>
  </form>
</div>

<div class="sheetwrap" id="editBox" hidden>
  <form class="sheet" id="editForm">
    <div class="grabber"></div>
    <div class="nav"><button type="button" data-close>Cancel</button><h3 id="eTitle">New App</h3><button type="submit">Save</button></div>
    <div class="preview"><div class="icon" id="pIcon">🔗</div></div>
    <div class="grp">
      <label class="field"><span>Name</span><input id="eName" placeholder="Required" required></label>
      <label class="field"><span>Link</span><input id="eUrl" type="url" placeholder="https://"></label>
      <div class="field"><span>HTML file</span><div class="iconbtns"><span class="hfile" id="hFile"></span><button type="button" class="tbtn" id="pickHtml">Upload HTML</button><button type="button" class="tbtn destructive" id="rmHtml" hidden>Remove</button></div>
        <input type="file" id="htmlFile" accept=".html,.htm,text/html" hidden></div>
      <label class="field"><span>About</span><input id="eDesc" placeholder="Short description"></label>
    </div>
    <div class="grp">
      <div class="field"><span>Photo</span><div class="iconbtns"><button type="button" class="tbtn" id="pickPhoto">Choose Photo</button><button type="button" class="tbtn destructive" id="rmPhoto" hidden>Remove</button></div>
        <input type="file" id="photoFile" accept="image/*" hidden></div>
      <label class="field"><span>Emoji</span><input id="eIcon" placeholder="Used when there’s no photo"></label>
      <div class="swatches" id="swatches" role="group" aria-label="Icon colour"></div>
    </div>
    <div class="grp">
      <label class="field"><span>Group</span><input id="eCat" list="cats" placeholder="Operations"></label>
      <label class="field"><span>Order</span><input id="eSort" type="number" inputmode="numeric" value="0"></label>
    </div>
    <datalist id="cats"><option value="Operations"><option value="Dashboards"><option value="Training"></datalist>
    <p class="foot">Lower order numbers appear first.</p>
    <p class="err" id="eErr"></p>
  </form>
</div>

<div class="scrim" id="delBox" hidden>
  <div class="alert">
    <div class="body"><h3 id="delTitle">Delete app?</h3><p>This removes it from the portal for everyone.</p><p class="err" id="dErr"></p></div>
    <div class="acts"><button type="button" data-close>Cancel</button><button type="button" class="destructive" id="delYes">Delete</button></div>
  </div>
</div>

<div class="toast lg" id="toast" hidden></div>

<script>
const SB_URL="https://rcufmnidwyycbrtqgqga.supabase.co";
const SB_KEY="sb_publishable_u2__PPq2nDZLyoNnLHxkVA_olltjpHc";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,"")}catch{return u}};
const isClaude=u=>/(^|\.)claude\.ai$/.test(host(u));
const PALETTE=[["#E9D3B2","#D4B38B"],["#A9DCCB","#84C6B2"],["#3A3A3A","#111111"],["#FFF8EF","#EADFCF"],["#E58A7E","#B8323F"]];
let apps=[],cred=null,editingId=null,deletingId=null,status={},pickedColor=null;

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
function dockIds(){let d=store.get("hmDock",null);if(!d)d=[];return d.filter(id=>apps.some(a=>a.id===id)).slice(0,4)}
const isImg=v=>/^data:image\//i.test(v||"")||/^(https?:\/\/|icons\/).+\.(svg|png|jpe?g|webp)(\?.*)?$/i.test(v||"");
const emo=a=>String(a.icon||"").split("|")[0]||"🔗";const cidx=a=>{const n=parseInt(String(a.icon||"").split("|")[1]);return isNaN(n)?null:n};
function colorFor(a){const c=cidx(a);if(c!=null&&PALETTE[c])return PALETTE[c];let h=0;for(const ch of a.name)h=(h*31+ch.charCodeAt(0))>>>0;return PALETTE[h%4]}
function iconHTML(a,big){const [c1,c2]=colorFor(a);const cl=isClaude(a.url);const e=emo(a);
  return `<div class="icon${isImg(e)?" img":""}" style="background:linear-gradient(165deg,${c1},${c2})">${isImg(e)?`<img src="${esc(e)}" alt="" draggable="false">`:esc(e)}${big||cl?"":`<i class="badge wait" data-b="${a.id}"></i>`}</div>`}
function appHTML(a,i){return `<a class="app" href="${esc(a.url)}" target="_blank" rel="noopener" data-id="${a.id}" style="--i:${i}" aria-label="${esc(a.name)}">
  <button class="del" type="button" data-del="${a.id}" aria-label="Delete ${esc(a.name)}">−</button>${iconHTML(a)}<span class="name">${esc(a.name)}</span></a>`}

async function load(){
  try{const r=await fetch(SB_URL+"/rest/v1/portal_apps?select=*&order=sort_order.asc,name.asc",{headers:H});
    if(!r.ok)throw 0;apps=await r.json();render();checkAll();setTimeout(()=>document.body.classList.add("ready"),1000);
  }catch{$("empty").hidden=false;$("empty").textContent="Couldn't load your apps. Refresh to try again."}
}
function render(){
  const q=$("search").value.trim().toLowerCase();const dock=dockIds();
  const list=q?apps.filter(a=>(a.name+" "+(a.description||"")+" "+(a.category||"")).toLowerCase().includes(q)):apps.filter(a=>!dock.includes(a.id));
  $("widget").hidden=!!q;$("resultsTitle").hidden=!q;
  $("grid").innerHTML=list.map(appHTML).join("");
  const showEmpty=(q&&!list.length)||!apps.length;$("empty").hidden=!showEmpty;
  $("empty").textContent=apps.length?"No Results":"No apps yet. Tap the person icon to sign in and add one.";
  const d=apps.filter(a=>dock.includes(a.id)).sort((x,y)=>dock.indexOf(x.id)-dock.indexOf(y.id));
  $("dock").innerHTML=d.length?d.map(appHTML).join(""):'<div class="hint">Touch and hold an app to add it to the Dock</div>';
  Object.keys(status).forEach(paint);widget();
}
function paint(id){document.querySelectorAll(`[data-b="${id}"]`).forEach(b=>b.className="badge"+(status[id]==="up"?"":" down"))}
function widget(){
  const ch=apps.filter(a=>!isClaude(a.url));const done=ch.every(a=>status[a.id]);
  const on=ch.filter(a=>status[a.id]==="up").length,off=ch.filter(a=>status[a.id]==="down");
  $("wOn").textContent=done?on:"–";$("wOff").textContent=done?off.length:"–";
  $("wDate").textContent=new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  $("wSub").textContent=!done?"Checking your apps…":off.length?off.map(a=>a.name).join(", ")+" not responding":`All ${apps.length} apps ready`;
}
async function check(a){
  if(isClaude(a.url))return;const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);
  try{await fetch(a.url,{mode:"no-cors",cache:"no-store",signal:c.signal});status[a.id]="up"}catch{status[a.id]="down"}
  clearTimeout(t);paint(a.id);widget();
}
function checkAll(){apps.forEach(check)}
setInterval(checkAll,120000);

/* touch & hold menu */
let pressT=null,pressed=false,startXY=null;
const ico={open:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>'};
function openMenu(id){
  const a=apps.find(x=>x.id===id);if(!a)return;const inDock=dockIds().includes(id),full=dockIds().length>=4;
  $("menuWrap").innerHTML=`${iconHTML(a,true)}<div class="menu" role="menu">
    <div class="head"><b>${esc(a.name)}</b><span>${esc(a.description||host(a.url))}</span></div>
    <a href="${esc(a.url)}" target="_blank" rel="noopener" role="menuitem">Open${ico.open}</a>
    ${inDock?`<button type="button" data-act="undock">Remove from Dock${ico.minus}</button>`:full?`<div class="muted">Dock is full (4 apps)</div>`:`<button type="button" data-act="dock">Add to Dock${ico.plus}</button>`}
    <button type="button" data-act="copy">Copy Link${ico.copy}</button></div>`;
  $("menuWrap").dataset.id=id;$("menuWrap").hidden=false;
}
$("menuWrap").addEventListener("click",async e=>{
  const id=$("menuWrap").dataset.id,act=e.target.closest("[data-act]")?.dataset.act;
  if(act==="dock"){store.set("hmDock",[...dockIds(),id]);render();toast("Added to Dock")}
  else if(act==="undock"){store.set("hmDock",dockIds().filter(x=>x!==id));render();toast("Removed from Dock")}
  else if(act==="copy"){const a=apps.find(x=>x.id===id);try{await navigator.clipboard.writeText(a.url);toast("Link Copied")}catch{toast(a.url)}}
  else if(!e.target.closest(".menu a")&&e.target.closest(".menu"))return;
  $("menuWrap").hidden=true;
});
const editing=()=>document.body.classList.contains("edit");
function bindPress(root){
  root.addEventListener("pointerdown",e=>{const app=e.target.closest(".app");if(!app||editing())return;
    pressed=false;startXY=[e.clientX,e.clientY];clearTimeout(pressT);
    pressT=setTimeout(()=>{pressed=true;if(navigator.vibrate)navigator.vibrate(8);openMenu(app.dataset.id)},480)});
  root.addEventListener("pointermove",e=>{if(startXY&&Math.hypot(e.clientX-startXY[0],e.clientY-startXY[1])>10)clearTimeout(pressT)});
  ["pointerup","pointercancel","pointerleave"].forEach(t=>root.addEventListener(t,()=>clearTimeout(pressT)));
  root.addEventListener("contextmenu",e=>{const app=e.target.closest(".app");if(!app)return;e.preventDefault();
    if(!pressed&&!editing()){pressed=true;clearTimeout(pressT);openMenu(app.dataset.id)}});
  root.addEventListener("click",e=>{
    const app=e.target.closest(".app");if(!app)return;
    if(pressed){e.preventDefault();pressed=false;return}
    if(editing()){e.preventDefault();const del=e.target.closest("[data-del]");
      if(del){deletingId=del.dataset.del;$("delTitle").textContent=`Delete “${apps.find(a=>a.id===deletingId)?.name}”?`;$("dErr").textContent="";$("delBox").hidden=false}
      else fillForm(apps.find(a=>a.id===app.dataset.id))}
  });
}
bindPress($("grid"));bindPress($("dock"));

/* admin */
async function rpc(fn,body){const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&j.message)||"Something went wrong. Try again.");return j}
document.querySelectorAll("[data-close]").forEach(b=>b.addEventListener("click",()=>b.closest(".scrim,.sheetwrap").hidden=true));
document.querySelectorAll(".scrim,.sheetwrap").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.hidden=true}));
$("adminBtn").onclick=()=>{$("lErr").textContent="";$("loginBox").hidden=false;setTimeout(()=>$("lUser").focus(),50)};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("lErr").textContent="Checking…";
  const u=$("lUser").value.trim(),p=$("lPass").value;
  try{if(!await rpc("portal_check",{p_user:u,p_pass:p})){$("lErr").textContent="Incorrect ID or password.";return}
    cred={u,p};$("lPass").value="";$("loginBox").hidden=true;setEdit(true);toast("Tap an app to edit it");
  }catch(err){$("lErr").textContent=err.message}};
function setEdit(on){document.body.classList.toggle("edit",on);$("adminBtn").hidden=on;$("doneBtn").hidden=!on;$("addBtn").hidden=!on}
$("doneBtn").onclick=()=>{setEdit(false);cred=null};
$("addBtn").onclick=()=>fillForm(null);

function swatches(){$("swatches").innerHTML=PALETTE.map((c,i)=>`<button type="button" class="sw" style="background:linear-gradient(165deg,${c[0]},${c[1]})" data-sw="${i}" aria-pressed="${pickedColor===i}" aria-label="Colour ${i+1}"></button>`).join("")}
$("swatches").onclick=e=>{const b=e.target.closest("[data-sw]");if(!b)return;pickedColor=+b.dataset.sw;swatches();preview()};
let iconImg=null;
function preview(){const typed=$("eIcon").value.trim();const tmp={id:editingId||"_",name:$("eName").value||"App",icon:iconImg||typed};
  const hasImg=!!iconImg||isImg(typed);$("rmPhoto").hidden=!hasImg;$("pickPhoto").textContent=hasImg?"Change Photo":"Choose Photo";const [c1,c2]=pickedColor!=null?PALETTE[pickedColor]:colorFor(tmp);
  $("pIcon").style.background=`linear-gradient(165deg,${c1},${c2})`;const e=emo(tmp);$("pIcon").className="icon"+(isImg(e)?" img":"");$("pIcon").innerHTML=isImg(e)?`<img src="${esc(e)}" alt="">`:esc(e)}
["eName","eIcon"].forEach(id=>$(id).addEventListener("input",preview));
function fillForm(a){editingId=a?a.id:null;$("eTitle").textContent=a?"Edit App":"New App";$("eErr").textContent="";
  $("eName").value=a?.name||"";$("eUrl").value=a?.url||"";$("eDesc").value=a?.description||"";$("eCat").value=a?.category||"";
  {const cur=a?emo(a):"";iconImg=a&&isImg(cur)?cur:null;$("eIcon").value=iconImg?"":(a?cur:"")}$("eSort").value=a?.sort_order??(apps.length+1);
  pageId=a?pageIdOf(a.url):null;htmlPending=null;htmlState();
  pickedColor=a?cidx(a):null;swatches();preview();$("editBox").hidden=false}
$("editForm").onsubmit=async e=>{e.preventDefault();
  let url=$("eUrl").value.trim();
  if(!htmlPending&&!pageId&&!/^https?:\/\/\S+$/i.test(url)){$("eErr").textContent="Add a link starting with https://, or upload an HTML file.";return}
  $("eErr").textContent=htmlPending?"Uploading page…":"Saving…";
  try{
    if(htmlPending){const pid=await rpc("portal_save_page",{p_user:cred.u,p_pass:cred.p,p_id:pageId,p_name:$("eName").value.trim(),p_file:htmlPending.name,p_html:htmlPending.text});
      url=pageUrl(pid);$("eErr").textContent="Saving…"}
    else if(pageId)url=pageUrl(pageId);
    const id=await rpc("portal_save_app",{p_user:cred.u,p_pass:cred.p,p_id:editingId,p_name:$("eName").value.trim(),p_url:url,
      p_description:$("eDesc").value.trim(),p_category:$("eCat").value.trim(),p_icon:(iconImg||$("eIcon").value.trim()||"🔗")+(pickedColor!=null?"|"+pickedColor:""),p_sort:parseInt($("eSort").value)||0});
    $("editBox").hidden=true;toast(editingId?"Saved":"App Added");load();
  }catch(err){$("eErr").textContent=err.message}};
/* icon photo: pick from gallery → square-crop, resize to 256px, store with the app */
$("pickPhoto").onclick=()=>$("photoFile").click();
$("pIcon").onclick=()=>$("photoFile").click();
$("rmPhoto").onclick=()=>{iconImg=null;if(isImg($("eIcon").value.trim()))$("eIcon").value="";preview()};
$("photoFile").onchange=async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  if(!/^image\//.test(file.type)){$("eErr").textContent="That file isn't an image. Choose a photo.";return}
  $("eErr").textContent="Preparing photo…";$("pickPhoto").disabled=true;
  try{
    const url=URL.createObjectURL(file);const img=new Image();img.src=url;await img.decode();
    const side=Math.min(img.naturalWidth,img.naturalHeight),S=256,c=document.createElement("canvas");c.width=c.height=S;
    const g=c.getContext("2d");g.imageSmoothingQuality="high";
    g.drawImage(img,(img.naturalWidth-side)/2,(img.naturalHeight-side)/2,side,side,0,0,S,S);URL.revokeObjectURL(url);
    let data=c.toDataURL("image/webp",.86);if(!data.startsWith("data:image/webp"))data=c.toDataURL("image/png");
    iconImg=data;$("eErr").textContent="";preview();
  }catch{$("eErr").textContent="Couldn't read that photo. Try a different one."}
  finally{$("pickPhoto").disabled=false}
};
/* HTML pages: upload a report/page file; the tile opens it exactly as uploaded (view.html) */
let htmlPending=null,pageId=null;
const pageUrl=id=>new URL("view.html?p="+id,location.href).href;
const pageIdOf=u=>{const m=/view\.html\?p=([0-9a-f-]{36})/i.exec(u||"");return m?m[1]:null};
function htmlState(){
  const has=!!htmlPending||!!pageId;
  $("hFile").textContent=htmlPending?htmlPending.name:pageId?"Uploaded page":"";
  $("pickHtml").textContent=has?"Replace":"Upload HTML";$("rmHtml").hidden=!has;
  const u=$("eUrl");u.disabled=has;if(has){u.value="";u.placeholder="Opens the uploaded page"}else u.placeholder="https://";
  if(!has&&!editingId)u.value=u.value||"";
}
$("pickHtml").onclick=()=>$("htmlFile").click();
$("rmHtml").onclick=()=>{htmlPending=null;pageId=null;htmlState()};
$("htmlFile").onchange=e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  if(!/\.html?$/i.test(f.name)&&f.type!=="text/html"){$("eErr").textContent="That isn't an HTML file. Choose a .html file.";return}
  if(f.size>8*1024*1024){$("eErr").textContent="That file is over 8 MB. Choose a smaller HTML file.";return}
  const rd=new FileReader();
  rd.onload=()=>{htmlPending={name:f.name,text:String(rd.result)};$("eErr").textContent="";
    if(!$("eName").value.trim()){const t=/<title[^>]*>([\s\S]*?)<\/title>/i.exec(htmlPending.text);$("eName").value=(t?t[1].replace(/\s+/g," ").trim().split(/\s[—–|·-]\s/)[0]:f.name.replace(/\.html?$/i,"")).slice(0,40);preview()}
    htmlState()};
  rd.onerror=()=>{$("eErr").textContent="Couldn't read that file. Try again."};
  rd.readAsText(f);
};
$("delYes").onclick=async()=>{$("dErr").textContent="Deleting…";
  try{const gone=apps.find(a=>a.id===deletingId);await rpc("portal_delete_app",{p_user:cred.u,p_pass:cred.p,p_id:deletingId});
    const pid=gone&&pageIdOf(gone.url);if(pid){try{await rpc("portal_delete_page",{p_user:cred.u,p_pass:cred.p,p_id:pid})}catch{}}
    $("delBox").hidden=true;toast("Deleted");load()}
  catch(err){$("dErr").textContent=err.message}};

let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=true;void t.offsetWidth;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,1800)}

/* ---------- live background: bear follows the cursor ----------
   99 frames: the clip's 50-frame head turn (frames 59–108) plus an optical-flow in-between for every pair.
   NOSE = his nose x-position (1280px source) per frame, measured by tracking the clip; far left → far right. */
(()=>{
  const NOSE=[464,465,466,468,470,473,476,480.5,485,490,495,500.5,506,511.5,517,523,529,535,541,547,553,559.5,566,572.5,579,585.5,592,598.5,605,611.5,618,624.5,631,637.5,644,651,658,665,672,679,686,693,700,707,714,721,728,735,742,749,756,763,770,776.5,783,789.5,796,802.5,809,815.5,822,829,836,843,850,857.5,865,872.5,880,887.5,895,902.5,910,917,924,930.5,937,943.5,950,961.5,973,977.5,982,985.5,989,991.5,994,995.5,997,998,999,1000,1001,1001.5,1002,1002.5,1003,1003.5,1004];
  const N=NOSE.length,SW=1280,SH=720,CENTRE=648,MIN_VISIBLE=820;
  const TIERS={1280:{w:1280,h:720,per:12,sheets:9},854:{w:854,h:480,per:17,sheets:6}};
  const wrap=$("stage"),cv=$("stageCanvas"),ctx=cv.getContext("2d");
  const coarse=matchMedia("(pointer: coarse)").matches,still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const T=TIERS[coarse?854:1280];
  const clamp=(v,a,b)=>v<a?a:v>b?b:v;
  function noseToFrame(x){x=clamp(x,NOSE[0],NOSE[N-1]);let lo=0,hi=N-1;while(hi-lo>1){const m=(lo+hi)>>1;if(NOSE[m]<=x)lo=m;else hi=m}return lo+(x-NOSE[lo])/(NOSE[hi]-NOSE[lo])}
  const IDLE=Math.round(noseToFrame(CENTRE));

  /* frames are cut out of the sheets into decoded bitmaps once, so scrubbing never waits on image decoding */
  const frames=new Array(N);
  const poster=new Image();poster.src=`frames/poster-${T.w===1280?1280:960}.jpg`;
  poster.decode?poster.decode().then(()=>{dirty=true;kick()},()=>{}):poster.onload=()=>{dirty=true;kick()};
  const first=Math.floor(IDLE/T.per);
  const canBitmap=typeof createImageBitmap==="function";
  [...Array(T.sheets).keys()].sort((a,b)=>Math.abs(a-first)-Math.abs(b-first)).forEach(si=>{
    const img=new Image();img.decoding="async";img.src=`frames/s${T.w}-${si}.webp`;
    const done=async()=>{
      const count=Math.min(T.per,N-si*T.per);
      for(let k=0;k<count;k++){
        const fi=si*T.per+k;
        if(canBitmap){try{frames[fi]=await createImageBitmap(img,k*T.w,0,T.w,T.h);continue}catch(e){}}
        frames[fi]={sheet:img,k};
      }
      dirty=true;kick();
    };
    img.decode?img.decode().then(done,()=>img.complete&&done()):(img.onload=done);
  });

  /* fit: fill the screen, centred on the bear; on tall phones keep enough width that his head never leaves the screen */
  let box={x:0,y:0,w:0,h:0,s:1};
  function size(){
    const vw=innerWidth,vh=innerHeight;let s=Math.max(vw/SW,vh/SH);
    s=Math.min(s,vw/MIN_VISIBLE);
    const w=SW*s,h=SH*s,x=(vw-w)/2,y=Math.min((vh-h)/2,Math.max(0,vh*.55-h/2));
    box={x,y,w,h,s};
    Object.assign(cv.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
    cv.classList.toggle("fade",h<vh-1);
    const dpr=Math.min(devicePixelRatio||1,2.5),bw=Math.round(Math.min(w*dpr,T.w*1.6));
    if(cv.width!==bw){cv.width=bw;cv.height=Math.round(bw*9/16);ctx.imageSmoothingQuality="high"}
    dirty=true;kick();
  }
  addEventListener("resize",size);

  let f=IDLE,v=0,target=IDLE,mode="idle",dirty=true,raf=0,prev=0,snapT=0;
  function blit(i,a){const fr=frames[i];ctx.globalAlpha=a;
    if(fr.sheet)ctx.drawImage(fr.sheet,fr.k*T.w,0,T.w,T.h,0,0,cv.width,cv.height);else ctx.drawImage(fr,0,0,cv.width,cv.height)}
  function nearest(i){for(let d=0;d<N;d++){if(i-d>=0&&frames[i-d])return i-d;if(i+d<N&&frames[i+d])return i+d}return -1}
  function draw(){
    let i=Math.floor(f),fr=f-i;
    if(frames[i]){blit(i,1);if(fr>.002&&i+1<N&&frames[i+1])blit(i+1,fr)}
    else if((i=nearest(i))>=0)blit(i,1);
    else if(poster.complete&&poster.naturalWidth){ctx.globalAlpha=1;ctx.drawImage(poster,0,0,cv.width,cv.height)}
    else return;
    ctx.globalAlpha=1;cv.classList.add("ready");
  }
  /* critically damped springs: smooth follow while tracking, slower glide home */
  const SPRING={track:{k:110,z:1},settle:{k:60,z:1},idle:{k:28,z:1}};
  function step(now){
    raf=0;const dt=Math.min(.05,(now-(prev||now))/1000);prev=now;
    const {k,z}=SPRING[mode],c=2*Math.sqrt(k)*z;
    let t=dt;while(t>0){const h=Math.min(t,1/240);v+=(k*(target-f)-c*v)*h;f+=v*h;t-=h}
    f=clamp(f,0,N-1);
    const settled=Math.abs(target-f)<.003&&Math.abs(v)<.01;if(settled){f=target;v=0}
    draw();dirty=false;
    if(!settled)kick();else prev=0;
  }
  function kick(){if(!raf)raf=requestAnimationFrame(step)}

  /* cursor x across the whole screen → frame (continuous); when the cursor stops he settles onto the nearest whole frame */
  function aim(cx){
    const nx=box.x+CENTRE*box.s,vw=innerWidth;
    let u=cx<nx?(cx-nx)/Math.max(1,nx):(cx-nx)/Math.max(1,vw-nx);
    u=clamp(u,-1,1);u=Math.sign(u)*Math.pow(Math.abs(u),.85);
    target=noseToFrame(CENTRE+u*(u<0?CENTRE-NOSE[0]:NOSE[N-1]-CENTRE));mode="track";kick();
    clearTimeout(snapT);snapT=setTimeout(()=>{if(mode==="track"){mode="settle";target=Math.round(target);kick()}},160);
  }
  let leaveT=0;
  function rest(){clearTimeout(snapT);mode="idle";target=IDLE;kick()}
  if(!still){
    addEventListener("pointermove",e=>{if(e.pointerType==="mouse"||e.pointerType==="pen"){clearTimeout(leaveT);aim(e.clientX)}},{passive:true});
    document.documentElement.addEventListener("pointerleave",()=>{clearTimeout(leaveT);leaveT=setTimeout(rest,90)});
    addEventListener("touchstart",e=>{clearTimeout(leaveT);aim(e.touches[0].clientX)},{passive:true});
    addEventListener("touchmove",e=>aim(e.touches[0].clientX),{passive:true});
    addEventListener("touchend",e=>{if(!e.touches.length){clearTimeout(leaveT);leaveT=setTimeout(rest,250)}},{passive:true});
    addEventListener("touchcancel",rest,{passive:true});
    addEventListener("blur",rest);
  }
  document.addEventListener("visibilitychange",()=>{if(document.hidden){cancelAnimationFrame(raf);raf=0;prev=0}else kick()});
  size();
})();
</script>
