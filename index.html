<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HM Portal</title>
<style>
/* Layout: frosted header, search, glass tiles grouped by category over the HM photo; dialogs are glass sheets */
:root{
  --fg:#111111; --muted:rgba(17,17,17,.62); --glass:rgba(245,237,227,.62); --glass-strong:rgba(245,237,227,.82);
  --stroke:rgba(255,255,255,.55); --hair:rgba(17,17,17,.08); --tan:#D4B38B; --teal:#84C6B2; --teal-ink:#2F7564;
  --up:#30B57E; --down:#E0483B; --wait:#A89C8D; --shadow:0 1px 1px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.14),0 24px 60px rgba(0,0,0,.12);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-in-out:cubic-bezier(.77,0,.175,1);
  --font:"Frutiger LT Arabic","Frutiger",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --fg:#F5EDE3; --muted:rgba(245,237,227,.66); --glass:rgba(28,22,20,.55); --glass-strong:rgba(28,22,20,.78);
  --stroke:rgba(255,255,255,.14); --hair:rgba(255,255,255,.08); --teal-ink:#84C6B2; color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0}
body::before{content:"";position:fixed;inset:0;z-index:-2;background-color:#8E1B2B;
  background-image:url("bg.jpg");background-image:image-set(url("bg.webp") type("image/webp"),url("bg.jpg") type("image/jpeg"));
  background-size:cover;background-position:center;background-repeat:no-repeat}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(120% 80% at 50% 0%,rgba(0,0,0,0) 40%,rgba(0,0,0,.28) 100%)}
body{background:transparent;color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(20px,env(safe-area-inset-top,0px)) max(40px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:22px}

/* glass material */
.glass,.tile,.search,.panel,.empty,.msg,.adminbar{
  background:var(--glass);
  -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
  border:1px solid var(--stroke);box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.35)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.tile,.search,.panel,.empty,.msg,.adminbar{background:var(--glass-strong)}}

header{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-radius:24px;padding:14px 16px 14px 14px;
  position:sticky;top:max(12px,env(safe-area-inset-top,0px));z-index:5}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.logo{width:48px;height:48px;border-radius:14px;background:#111;color:#F5EDE3;display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.5px;flex:none;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 12px rgba(0,0,0,.25)}
.brand h1{margin:0;font-size:22px;line-height:1.1;letter-spacing:-.02em;font-weight:700}
.brand p{margin:3px 0 0;color:var(--muted);font-size:13px}

.btn{font:inherit;font-size:14px;font-weight:600;border:0;background:rgba(17,17,17,.06);color:var(--fg);padding:9px 16px;border-radius:999px;cursor:pointer;
  transition:transform 160ms var(--ease-out),background-color 200ms var(--ease-out),opacity 200ms}
@media (prefers-color-scheme:dark){.btn{background:rgba(255,255,255,.1)}}
.btn:active{transform:scale(.97)}
.btn.primary{background:#111;color:#F5EDE3}
.btn.danger{background:rgba(224,72,59,.12);color:var(--down)}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:rgba(17,17,17,.12)}
  .btn.primary:hover{background:var(--teal-ink);color:#fff}
  .btn.danger:hover{background:var(--down);color:#fff}}
.btn:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--teal) 70%,transparent);outline-offset:2px}

.searchwrap{position:relative}
.searchwrap svg{position:absolute;left:16px;top:50%;width:17px;height:17px;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search{width:100%;font:inherit;font-size:16px;padding:13px 16px 13px 44px;border-radius:16px;color:var(--fg);-webkit-appearance:none;appearance:none;
  transition:box-shadow 200ms var(--ease-out)}
.search::placeholder{color:var(--muted)}

.cat{display:flex;flex-direction:column;gap:12px}
.cat h2{margin:0 4px;font-size:13px;font-weight:600;letter-spacing:.02em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.45)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:18px;border-radius:22px;color:inherit;text-decoration:none;min-width:0;
  transition:transform 200ms var(--ease-out),box-shadow 200ms var(--ease-out);
  animation:rise 420ms var(--ease-out) both;animation-delay:calc(var(--i,0) * 45ms)}
.tile:active{transform:scale(.98)}
@media (hover:hover) and (pointer:fine){.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow),0 18px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.4)}}
body.ready .tile{animation:none}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.tile .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:23px;margin-bottom:4px;
  background:linear-gradient(160deg,#E4C9A3,#D4B38B);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 3px 8px rgba(0,0,0,.12)}
.tile h3{margin:0;font-size:17px;line-height:1.25;letter-spacing:-.01em;font-weight:700}
.tile p{margin:0;color:var(--muted);font-size:13.5px}
.tile .host{font-size:12px;color:var(--teal-ink);overflow-wrap:anywhere;margin-top:auto;font-weight:600}
.dot{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--muted);
  padding:4px 9px 4px 7px;border-radius:999px;background:rgba(255,255,255,.35)}
@media (prefers-color-scheme:dark){.dot{background:rgba(255,255,255,.08)}}
.dot i{width:8px;height:8px;border-radius:50%;background:var(--wait);display:inline-block}
.dot.up i{background:var(--up);box-shadow:0 0 0 3px rgba(48,181,126,.22)} .dot.down i{background:var(--down);box-shadow:0 0 0 3px rgba(224,72,59,.22)}
.tile .edit{display:none;gap:8px;margin-top:6px}
body.admin .tile .edit{display:flex}
.empty,.msg{padding:28px;text-align:center;color:var(--muted);border-radius:22px}
footer{color:rgba(255,255,255,.9);font-size:12px;text-align:center;text-shadow:0 1px 6px rgba(0,0,0,.5)}

.adminbar{display:none;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:10px 10px 10px 18px;border-radius:18px}
.adminbar strong{display:flex;align-items:center;gap:8px}
.adminbar strong::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px rgba(132,198,178,.3)}
body.admin .adminbar{display:flex}

/* dialogs: dimmed backdrop, glass sheet (bottom sheet on phones) */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:grid;place-items:center;z-index:20;
  padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  animation:fade 200ms var(--ease-out) both}
.panel{width:100%;max-width:420px;border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:12px;background:var(--glass-strong);
  animation:pop 260ms var(--ease-out) both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:560px){
  .overlay{place-items:end center}
  .panel{max-width:none;border-radius:26px 26px 22px 22px;animation-name:sheet}
  @keyframes sheet{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}}
.panel h3{margin:0 0 2px;font-size:19px;letter-spacing:-.01em}
.panel label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.panel input,.panel select{font:inherit;font-size:16px;font-weight:400;padding:11px 13px;border:1px solid var(--hair);border-radius:12px;background:rgba(255,255,255,.55);color:var(--fg)}
@media (prefers-color-scheme:dark){.panel input,.panel select{background:rgba(255,255,255,.07)}}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.err{color:var(--down);font-size:13px;min-height:1em;margin:0}

@media (max-width:420px){.brand h1{font-size:19px}.brand p{display:none}.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="glass">
    <div class="brand">
      <div class="logo" aria-hidden="true">½M</div>
      <div><h1>HM Portal</h1><p>All Half Million tools in one place</p></div>
    </div>
    <button class="btn" id="adminBtn" type="button">Admin</button>
  </header>

  <div class="adminbar">
    <strong>Admin mode</strong>
    <div class="row">
      <button class="btn primary" id="addBtn" type="button">Add app</button>
      <button class="btn" id="logoutBtn" type="button">Exit admin</button>
    </div>
  </div>

  <div class="searchwrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" id="search" type="search" placeholder="Search apps" aria-label="Search apps"></div>
  <main id="list"><div class="msg">Loading apps…</div></main>
  <footer>Green dot = site is reachable · Red dot = site is not responding · Claude links can't be checked</footer>
</div>

<!-- Login -->
<div class="overlay" id="loginBox" hidden>
  <form class="panel" id="loginForm">
    <h3>Admin sign in</h3>
    <label>ID<input id="lUser" autocomplete="username" required></label>
    <label>Password<input id="lPass" type="password" autocomplete="current-password" required></label>
    <p class="err" id="lErr"></p>
    <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Sign in</button></div>
  </form>
</div>

<!-- Add / edit -->
<div class="overlay" id="editBox" hidden>
  <form class="panel" id="editForm">
    <h3 id="eTitle">Add app</h3>
    <label>Name<input id="eName" required></label>
    <label>Link<input id="eUrl" type="url" placeholder="https://…" required></label>
    <label>Short description<input id="eDesc"></label>
    <label>Category<input id="eCat" list="cats" placeholder="Operations"></label>
    <datalist id="cats"><option value="Operations"><option value="Dashboards"><option value="Training"></datalist>
    <label>Icon (one emoji)<input id="eIcon" maxlength="4" placeholder="🔗"></label>
    <label>Order<input id="eSort" type="number" value="0"></label>
    <p class="err" id="eErr"></p>
    <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></div>
  </form>
</div>

<!-- Delete confirm -->
<div class="overlay" id="delBox" hidden>
  <div class="panel">
    <h3>Delete this app?</h3>
    <p id="delName" style="margin:0"></p>
    <p class="err" id="dErr"></p>
    <div class="row"><button class="btn" type="button" data-close>Cancel</button><button class="btn danger" id="delYes" type="button">Delete</button></div>
  </div>
</div>

<script>
const SB_URL="https://rcufmnidwyycbrtqgqga.supabase.co";
const SB_KEY="sb_publishable_u2__PPq2nDZLyoNnLHxkVA_olltjpHc";
const H={apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"};
let apps=[],cred=null,editingId=null,deletingId=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

async function load(){
  try{
    const r=await fetch(SB_URL+"/rest/v1/portal_apps?select=*&order=sort_order.asc,name.asc",{headers:H});
    if(!r.ok) throw new Error(r.status);
    apps=await r.json(); render(); checkAll(); setTimeout(()=>document.body.classList.add('ready'),900);
  }catch(e){ $("list").innerHTML='<div class="msg">Could not load the app list. Please refresh in a moment.</div>'; }
}
function host(u){try{return new URL(u).hostname.replace(/^www\./,"")}catch{return u}}
function render(){
  const q=$("search").value.trim().toLowerCase();
  const shown=apps.filter(a=>!q||(a.name+" "+a.description+" "+a.category).toLowerCase().includes(q));
  if(!shown.length){$("list").innerHTML='<div class="empty">'+(apps.length?"No apps match your search.":"No apps yet. Sign in as admin to add the first one.")+'</div>';return;}
  const groups={};shown.forEach(a=>(groups[a.category||"Other"]??=[]).push(a));
  $("list").innerHTML=Object.keys(groups).map(c=>`<section class="cat"><h2>${esc(c)}</h2><div class="grid">${groups[c].map((a,i)=>`
    <a class="tile" style="--i:${i}" href="${esc(a.url)}" target="_blank" rel="noopener">
      <span class="dot" data-id="${a.id}"><i></i><span>Checking</span></span>
      <span class="ic">${esc(a.icon||"🔗")}</span>
      <h3>${esc(a.name)}</h3>
      ${a.description?`<p>${esc(a.description)}</p>`:""}
      <span class="host">${esc(host(a.url))}</span>
      <span class="edit"><button class="btn" type="button" data-edit="${a.id}">Edit</button><button class="btn danger" type="button" data-del="${a.id}">Delete</button></span>
    </a>`).join("")}</div></section>`).join("");
  shown.forEach(a=>{ if(/(^|\.)claude\.ai$/.test(host(a.url))) check(a); else if(status[a.id]) setDot(a.id,status[a.id]); });
}
const status={};
function setDot(id,s){document.querySelectorAll(`.dot[data-id="${id}"]`).forEach(d=>{d.className="dot "+s;d.lastChild.textContent=s==="up"?"Online":"Offline";});}
async function check(a){
  if(/(^|\.)claude\.ai$/.test(host(a.url))){document.querySelectorAll(`.dot[data-id="${a.id}"]`).forEach(d=>{d.className="dot";d.lastChild.textContent="Claude link";});return;}
  const c=new AbortController();const t=setTimeout(()=>c.abort(),8000);
  try{await fetch(a.url,{mode:"no-cors",cache:"no-store",signal:c.signal});status[a.id]="up";}
  catch{status[a.id]="down";}
  clearTimeout(t);setDot(a.id,status[a.id]);
}
function checkAll(){apps.forEach(check);}
setInterval(checkAll,120000);

async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:H,body:JSON.stringify(body)});
  const j=await r.json().catch(()=>null);
  if(!r.ok) throw new Error((j&&j.message)||"Something went wrong");
  return j;
}
function open(id){$(id).hidden=false;} function close(el){el.closest(".overlay").hidden=true;}
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close(b));
document.querySelectorAll(".overlay").forEach(o=>o.addEventListener("click",e=>{if(e.target===o)o.hidden=true;}));

$("adminBtn").onclick=()=>{ if(cred){return;} $("lErr").textContent="";open("loginBox");$("lUser").focus(); };
$("loginForm").onsubmit=async e=>{
  e.preventDefault();$("lErr").textContent="Checking…";
  const u=$("lUser").value.trim(),p=$("lPass").value;
  try{const ok=await rpc("portal_check",{p_user:u,p_pass:p});
    if(!ok){$("lErr").textContent="Wrong ID or password.";return;}
    cred={u,p};document.body.classList.add("admin");$("loginBox").hidden=true;$("lPass").value="";$("adminBtn").hidden=true;
  }catch(err){$("lErr").textContent=err.message;}
};
$("logoutBtn").onclick=()=>{cred=null;document.body.classList.remove("admin");$("adminBtn").hidden=false;};

function fillForm(a){
  editingId=a?a.id:null;$("eTitle").textContent=a?"Edit app":"Add app";$("eErr").textContent="";
  $("eName").value=a?.name||"";$("eUrl").value=a?.url||"";$("eDesc").value=a?.description||"";
  $("eCat").value=a?.category||"";$("eIcon").value=a?.icon||"";$("eSort").value=a?.sort_order??(apps.length+1);
  open("editBox");$("eName").focus();
}
$("addBtn").onclick=()=>fillForm(null);
$("list").addEventListener("click",e=>{
  const ed=e.target.closest("[data-edit]"),dl=e.target.closest("[data-del]");
  if(!ed&&!dl) return; e.preventDefault();
  if(ed) fillForm(apps.find(a=>a.id===ed.dataset.edit));
  if(dl){deletingId=dl.dataset.del;$("delName").textContent=apps.find(a=>a.id===deletingId)?.name||"";$("dErr").textContent="";open("delBox");}
});
$("editForm").onsubmit=async e=>{
  e.preventDefault();$("eErr").textContent="Saving…";
  try{await rpc("portal_save_app",{p_user:cred.u,p_pass:cred.p,p_id:editingId,p_name:$("eName").value.trim(),p_url:$("eUrl").value.trim(),
      p_description:$("eDesc").value.trim(),p_category:$("eCat").value.trim(),p_icon:$("eIcon").value.trim(),p_sort:parseInt($("eSort").value)||0});
    $("editBox").hidden=true;load();
  }catch(err){$("eErr").textContent=err.message;}
};
$("delYes").onclick=async()=>{
  $("dErr").textContent="Deleting…";
  try{await rpc("portal_delete_app",{p_user:cred.u,p_pass:cred.p,p_id:deletingId});$("delBox").hidden=true;load();}
  catch(err){$("dErr").textContent=err.message;}
};
$("search").addEventListener("input",render);
load();
</script>
</body>
</html>
